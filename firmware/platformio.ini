[env:s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
; Flash size of your module (N8R2 -> 8MB). For 4MB modules delete these two lines.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; ESP32-BLE-Gamepad is vendored in lib/ (see lib/ESP32-BLE-Gamepad/VENDORED.md)
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
monitor_speed = 115200
